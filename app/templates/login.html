<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoLab API - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">MotoLab API</h3>
                        
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" required placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required placeholder="******">
                            </div>
                            <button type="submit" id="btnSubmit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const btnSubmit = document.getElementById('btnSubmit');
            const alertBox = document.getElementById('errorAlert');

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            alertBox.classList.add('d-none');

            if (!email || !password) {
                alertBox.textContent = 'Por favor complete todos los campos obligatorios.';
                alertBox.classList.remove('d-none');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Ingresando...';

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    // Redirección directa al panel interactivo
                    window.location.href = '/home';
                } else {
                    alertBox.textContent = data.detail || 'Correo o contraseña incorrectos.';
                    alertBox.classList.remove('d-none');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Iniciar Sesión';
                }
            } catch (err) {
                alertBox.textContent = 'Error de conexión con el servidor. Intente nuevamente.';
                alertBox.classList.remove('d-none');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
