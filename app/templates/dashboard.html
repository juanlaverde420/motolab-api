<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - MotoLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">MotoLab API</a>
            <div>
                <a href="/docs" class="btn btn-outline-light btn-sm me-2">Swagger Docs</a>
                <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Vehículos</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalVehiculo">+ Registrar Vehículo</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Propietario</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVehiculos">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Nuevo Vehículo -->
    <div class="modal fade" id="modalVehiculo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Registrar Nuevo Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formVehiculo">
                        <div class="mb-3">
                            <label class="form-label">Placa</label>
                            <input type="text" id="placa" class="form-control" placeholder="ABC123" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" id="marca" class="form-control" placeholder="Yamaha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" id="modelo" class="form-control" placeholder="XTZ 250" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ID Propietario</label>
                            <input type="number" id="propietarioId" class="form-control" placeholder="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Vehículo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login';
        });

        async function cargarVehiculos() {
            try {
                const res = await fetch('/vehiculos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Error al obtener vehículos');
                const vehiculos = await res.json();
                
                const tbody = document.getElementById('tablaVehiculos');
                tbody.innerHTML = '';

                vehiculos.forEach(v => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${v.id}</td>
                            <td><strong>${v.placa}</strong></td>
                            <td>${v.marca}</td>
                            <td>${v.modelo}</td>
                            <td>${v.propietario_id || 'N/A'}</td>
                            <td class="text-center">
                                <button onclick="eliminarVehiculo(${v.id})" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById('formVehiculo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                placa: document.getElementById('placa').value,
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                propietario_id: parseInt(document.getElementById('propietarioId').value)
            };

            const res = await fetch('/vehiculos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                location.reload();
            } else {
                alert('Error al guardar el vehículo');
            }
        });

        async function eliminarVehiculo(id) {
            if (!confirm('¿Seguro que deseas eliminar este vehículo?')) return;
            const res = await fetch(`/vehiculos/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) cargarVehiculos();
            else alert('No tienes permisos o no se pudo eliminar');
        }

        cargarVehiculos();
    </script>
</body>
</html>
