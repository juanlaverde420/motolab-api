<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - MotoLab API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">MotoLab API</a>
            <div id="navButtons">
                <!-- Se llena dinámicamente mediante JS -->
            </div>
        </div>
    </nav>

    <div class="container text-center my-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold text-primary">Bienvenido a MotoLab API</h1>
            <p class="fs-4 text-secondary mt-3">Sistema de gestión de mantenimiento vehicular para talleres de motocicletas.</p>
            <hr class="my-4">
            
            <div id="heroContent">
                <!-- Estado predeterminado -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const navButtons = document.getElementById('navButtons');
            const heroContent = document.getElementById('heroContent');

            if (token) {
                // Estado: Con Sesión (Muestra acceso a API y opción de salir)
                navButtons.innerHTML = `
                    <a href="/docs" class="btn btn-outline-light btn-sm me-2">Documentación API</a>
                    <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesión</button>
                `;

                heroContent.innerHTML = `
                    <div class="alert alert-success d-inline-block px-4 py-2 mb-4" role="alert">
                        <strong>Sesión activa.</strong> Has ingresado correctamente al sistema.
                    </div>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="/docs" class="btn btn-primary btn-lg px-4 gap-3">Administrar Sistema (Swagger)</a>
                    </div>
                `;

                document.getElementById('btnLogout').addEventListener('click', () => {
                    localStorage.removeItem('token');
                    window.location.reload();
                });
            } else {
                // Estado: Sin Sesión (Únicamente opción de iniciar sesión)
                navButtons.innerHTML = `
                    <a href="/login" class="btn btn-primary btn-sm">Iniciar Sesión</a>
                `;

                heroContent.innerHTML = `
                    <p class="text-muted fs-5">Debes iniciar sesión para acceder al panel y a la documentación de los endpoints.</p>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
                        <a href="/login" class="btn btn-primary btn-lg px-4 gap-3">Iniciar Sesión</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
